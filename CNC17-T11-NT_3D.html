<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Xem 3D - TOAN Tools</title>
<style>
  :root {
    --cam: #D97757;
    --cam-dam: #C26142;
    --cam-nhat: #FFF3EE;
    --nen: #F4F2EE;
    --trang: #FFFFFF;
    --chu: #1F2328;
    --chu-phu: #636B74;
    --vien: #E5E0D8;
    --bong: 0 6px 24px rgba(24, 24, 24, 0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    background: var(--nen); color: var(--chu);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; }

  #glCanvas, #ovCanvas {
    position: fixed; inset: 0; top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; height: 100%; display: block;
  }
  #glCanvas { touch-action: none; background: radial-gradient(circle at 50% 35%, #FAF9F6 0%, #EAE6DE 100%); }
  #ovCanvas { pointer-events: none; z-index: 5; }

  /* Ô tìm */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: calc(10px + env(safe-area-inset-top)) 12px 8px 12px; pointer-events: none;
  }
  .search-wrap {
    pointer-events: auto; max-width: 560px; margin: 0 auto; display: flex; align-items: center;
    background: var(--trang); border: 1.5px solid var(--vien); border-radius: 14px;
    padding: 5px 6px 5px 12px; box-shadow: var(--bong);
  }
  .search-wrap > * + * { margin-left: 8px; }
  .search-wrap:focus-within { border-color: var(--cam); }
  #searchInput {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 16px; color: var(--chu); padding: 8px 0; -webkit-user-select: text; user-select: text;
  }
  #searchInput::placeholder { color: #9AA0A6; }
  .btn-clear {
    display: none; align-items: center; justify-content: center; width: 34px; height: 34px;
    border: none; border-radius: 50%; background: #F1EFEA; color: var(--chu-phu);
    font-size: 18px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  .btn-clear.show { display: flex; }
  .btn-search {
    border: none; background: var(--cam); color: var(--trang); font-size: 15px; font-weight: 700;
    padding: 10px 16px; border-radius: 10px; cursor: pointer; flex-shrink: 0; min-height: 42px;
  }
  .btn-cam {
    width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--cam); background: var(--cam-nhat);
    color: var(--cam-dam); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
  }
  .btn-cam svg { width: 22px; height: 22px; }
  .btn-search:active { background: var(--cam-dam); }

  .file-meta {
    position: fixed; top: calc(74px + env(safe-area-inset-top)); left: 12px; z-index: 10;
    background: rgba(255,255,255,0.86); border: 1px solid rgba(229,224,216,0.9); border-radius: 10px;
    padding: 5px 10px; font-size: 12px; line-height: 1.35; color: var(--chu-phu);
    max-width: calc(100vw - 90px); pointer-events: none;
  }
  .file-meta strong { color: var(--chu); }
  .btn-gear {
    position: fixed; top: calc(72px + env(safe-area-inset-top)); right: 12px; z-index: 10;
    width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid var(--vien);
    background: var(--trang); box-shadow: var(--bong); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--chu);
  }
  .btn-gear svg { width: 24px; height: 24px; }

  /* Hộp kết quả đo */
  .do-box {
    position: fixed; top: calc(128px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 15; background: #23272D; color: #fff; border-radius: 12px; padding: 9px 14px;
    font-size: 14px; text-align: center; box-shadow: var(--bong); display: none; max-width: calc(100vw - 24px);
  }
  .do-box.show { display: block; }
  .do-box b { font-size: 20px; color: #FFB596; }
  .do-box .phu { font-size: 12px; color: #C9CDD2; margin-top: 2px; }

  .toast {
    position: fixed; top: calc(76px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%) translateY(-10px); z-index: 50; max-width: calc(100vw - 28px);
    padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: var(--bong);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.info { background: #23272D; color: #fff; }
  .toast.warn { background: #FFF6E0; color: #9A5B00; border: 1px solid #F2C97D; }
  .toast.error { background: #FDECEC; color: #B42318; border: 1px solid #F3B7B2; }

  /* Thẻ thông tin */
  .info-card {
    position: fixed; left: 10px; right: 10px; bottom: calc(132px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto; z-index: 25; background: var(--trang);
    border: 1.5px solid var(--vien); border-radius: 16px; padding: 12px 12px 10px 12px; box-shadow: var(--bong);
    display: none;
  }
  .info-card.show { display: block; }
  .info-head { display: flex; align-items: center; margin-bottom: 8px; }
  .info-head > * + * { margin-left: 12px; }
  .so-badge {
    min-width: 60px; padding: 8px 10px; border-radius: 12px; background: var(--cam); color: #fff;
    font-size: 26px; font-weight: 800; line-height: 1; text-align: center; flex-shrink: 0;
  }
  .so-badge.nho { font-size: 13px; padding: 10px 8px; background: #8B929A; }
  .so-badge.nhom { font-size: 14px; padding: 10px 8px; background: #3F6E8C; }
  .info-title-wrap { flex: 1; min-width: 0; }
  .info-title { font-size: 17px; font-weight: 700; word-break: break-word; line-height: 1.25; }
  .info-sub { margin-top: 3px; font-size: 13px; color: var(--chu-phu); }
  .btn-x {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: #F2EFEA; color: var(--chu);
    font-size: 20px; font-weight: 700; cursor: pointer; flex-shrink: 0; align-self: flex-start;
  }
  .warn-box {
    display: none; margin-bottom: 8px; padding: 8px 10px; border-radius: 10px; background: #FFF6E0;
    color: #9A5B00; border: 1px solid #F2C97D; font-size: 13px; font-weight: 600;
  }
  .warn-box.show { display: block; }
  .info-grid {
    display: -webkit-box; display: flex; flex-wrap: wrap; margin: 0 -4px;
    border-top: 1px solid var(--vien); padding-top: 6px;
  }
  .info-item { width: calc(50% - 8px); margin: 4px; background: #FAF8F5; border-radius: 10px; padding: 6px 10px; }
  .info-item.full { width: calc(100% - 8px); }
  .info-label { font-size: 11px; color: var(--chu-phu); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
  .info-val { font-size: 14px; font-weight: 700; display: flex; align-items: center; word-break: break-word; }
  .card-actions { display: flex; margin: 6px -4px 0; }
  .card-actions .mini-btn { padding: 10px 6px; }
  .mat-dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.22); flex-shrink: 0; margin-right: 6px; }

  /* Thanh nút 2 hàng */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 6px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    background: rgba(255,255,255,0.96); border-top: 1px solid var(--vien);
  }
  .bottom-inner { max-width: 600px; margin: 0 auto; display: flex; flex-wrap: wrap; }
  .nav-btn {
    width: calc(20% - 6px); margin: 3px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 52px; padding: 5px 2px; border-radius: 12px;
    border: 1.5px solid var(--vien); background: var(--trang); color: var(--chu);
    font-size: 11px; font-weight: 700; line-height: 1.15; cursor: pointer; text-align: center;
  }
  .nav-btn svg { width: 21px; height: 21px; display: block; margin-bottom: 3px; }
  .nav-btn.primary { background: var(--cam); border-color: var(--cam); color: #fff; }
  .nav-btn.on { background: #3B3F45; border-color: #3B3F45; color: #fff; }
  .nav-btn:active { transform: scale(0.96); }

  /* Bảng trượt */
  .sheet-backdrop {
    position: fixed; inset: 0; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
    background: rgba(0,0,0,0.42); display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-backdrop.show { display: flex; }
  .sheet {
    width: 100%; max-width: 580px; max-height: 80vh; max-height: 80dvh; background: var(--trang);
    border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px solid var(--vien);
  }
  .sheet-title { font-size: 17px; font-weight: 800; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px 16px 12px; }
  .sec-title { font-size: 13px; font-weight: 800; color: var(--chu-phu); text-transform: uppercase; margin: 12px 4px 6px; }
  .chips { display: flex; flex-wrap: wrap; margin: 0 -4px; }
  .chip {
    width: calc(33.33% - 8px); margin: 4px; min-height: 58px; border-radius: 12px; border: 2px solid var(--vien);
    background: #EFEDE9; color: #8A9096; font-size: 14px; font-weight: 800; cursor: pointer; padding: 6px 4px;
    line-height: 1.2; word-break: break-word;
  }
  .chip small { display: block; font-size: 12px; font-weight: 600; margin-top: 2px; }
  .chip.on { border-color: var(--cam); background: var(--cam-nhat); color: var(--chu); }
  .chip.on::before { content: "✓ "; color: var(--cam-dam); }
  .chip.chon { border-color: var(--cam); background: #fff; color: var(--chu); }
  .chip.rong { opacity: 0.5; cursor: default; }
  .chip .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  .sheet-actions { display: flex; padding: 4px; }
  .mini-btn {
    flex: 1; margin: 4px; border: 1.5px solid var(--vien); background: var(--trang); color: var(--chu);
    font-size: 14px; font-weight: 700; padding: 11px 10px; border-radius: 10px; cursor: pointer;
  }
  .mini-btn.accent { border-color: var(--cam); color: #fff; background: var(--cam); }

  .board-row {
    display: flex; align-items: center; padding: 11px 10px; border-bottom: 1px solid #F0ECE6;
    border-radius: 10px; cursor: pointer;
  }
  .board-row > * + * { margin-left: 12px; }
  .board-row.active, .board-row:active { background: var(--cam-nhat); }
  .row-num {
    min-width: 48px; padding: 7px 6px; border-radius: 10px; background: var(--cam); color: #fff;
    font-size: 16px; font-weight: 800; text-align: center; flex-shrink: 0;
  }
  .row-num.none { background: #9AA0A6; }
  .row-info { flex: 1; min-width: 0; }
  .row-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { margin-top: 2px; font-size: 12px; color: var(--chu-phu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-an { font-size: 11px; color: #B42318; font-weight: 700; }

  /* Cài đặt */
  .cd-row { padding: 10px 6px; border-bottom: 1px solid #F0ECE6; }
  .cd-row label { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .cd-row input[type=range] { width: 100%; accent-color: var(--cam); }
  .cd-toggle { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; }
  .switch {
    position: relative; width: 52px; height: 30px; border-radius: 999px; border: none; background: #D0CBC3;
    cursor: pointer; flex-shrink: 0;
  }
  .switch.on { background: var(--cam); }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.22); transition: transform 0.18s ease;
  }
  .switch.on::after { transform: translateX(22px); }

  /* QR + thông báo */
  .modal-overlay {
    position: fixed; inset: 0; top: 0; right: 0; bottom: 0; left: 0; z-index: 60;
    background: rgba(0,0,0,0.82); display: none; flex-direction: column; align-items: center;
    justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .qr-box { width: 100%; max-width: 420px; background: #14171A; border-radius: 18px; overflow: hidden; }
  .qr-video-wrap { position: relative; width: 100%; padding-top: 100%; background: #000; }
  #qrVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .qr-frame {
    position: absolute; top: 18%; right: 18%; bottom: 18%; left: 18%;
    border: 3px solid var(--cam); border-radius: 16px; box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
  }
  .qr-foot { padding: 14px; color: #fff; font-size: 14px; text-align: center; }
  .qr-foot .btn-full { margin-top: 10px; }
  .alert-box { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 20px; text-align: center; }
  .alert-box h3 { margin: 0 0 10px 0; font-size: 18px; }
  .alert-box p { white-space: pre-line; margin: 0 0 18px 0; font-size: 15px; line-height: 1.5; color: var(--chu-phu); }
  .btn-full {
    display: block; width: 100%; border: none; border-radius: 12px; background: var(--cam); color: #fff;
    font-size: 16px; font-weight: 700; padding: 13px; cursor: pointer;
  }
  .btn-full.phu { background: #fff; color: var(--cam-dam); border: 1.5px solid var(--cam); }

  #canhBaoJs {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100; background: #F4F2EE;
    display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
    font-size: 17px; line-height: 1.55; color: #1F2328;
  }
  #canhBaoJs .hop { max-width: 420px; background: #fff; border: 2px solid #D97757; border-radius: 18px; padding: 22px 18px; }
  #canhBaoJs b { color: #C26142; }
  #canhBaoJs .loi { margin-top: 12px; font-size: 13px; color: #B42318; word-break: break-word; }
</style>
</head>
<body>

<div id="canhBaoJs"><div class="hop">
  <div style="font-size:20px;font-weight:800;margin-bottom:10px;">Chưa mở được 3D</div>
  Ứng dụng đang xem file này không chạy được 3D (thường gặp khi xem trực tiếp trong <b>Zalo</b> hoặc app <b>Trình xem HTML</b>).<br><br>
  Hãy mở file bằng <b>Chrome</b> (iPhone: <b>Safari</b>).<br>
  Trong Zalo: bấm <b>⋮</b> ở góc trên → <b>Mở bằng</b> → <b>Chrome</b>.
  <div class="loi" id="canhBaoLoi"></div>
</div></div>

<canvas id="glCanvas"></canvas>
<canvas id="ovCanvas"></canvas>

<div class="top-bar">
  <div class="search-wrap">
    <input id="searchInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
           placeholder="Số tấm (vd: 71) hoặc dán tem 71.xương...">
    <button id="btnClear" class="btn-clear" type="button" aria-label="Xóa">×</button>
    <button id="btnScanTop" class="btn-cam" type="button" aria-label="Quét tem bằng camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <button id="btnSearch" class="btn-search" type="button">Tìm</button>
  </div>
</div>

<div class="file-meta" id="fileMeta"></div>
<button class="btn-gear" id="btnCaiDat" type="button" aria-label="Cài đặt">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>

<div class="do-box" id="doBox"></div>
<div class="toast" id="toast"></div>

<div class="info-card" id="infoCard">
  <div class="info-head">
    <div class="so-badge" id="cardSo">71</div>
    <div class="info-title-wrap">
      <div class="info-title" id="cardTen"></div>
      <div class="info-sub" id="cardSub"></div>
    </div>
    <button class="btn-x" id="btnCloseCard" type="button" aria-label="Đóng">×</button>
  </div>
  <div class="warn-box" id="cardWarn"></div>
  <div class="info-grid" id="cardGrid"></div>
  <div class="card-actions">
    <button type="button" class="mini-btn accent" id="btnXemRieng">Xem riêng</button>
  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <button class="nav-btn" id="tool_chon" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>Chọn tấm</button>
    <button class="nav-btn" id="tool_nhom" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Chọn nhóm</button>
    <button class="nav-btn" id="tool_an" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>Ẩn tấm</button>
    <button class="nav-btn" id="tool_do" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>Đo</button>
    <button class="nav-btn" id="btnXray" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" stroke-dasharray="3 2"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>XRAY</button>

    <button class="nav-btn primary" id="btnScan" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="7" width="4" height="4"/><rect x="7" y="13" width="4" height="4"/><path d="M13 13h2v2h-2zM16 16h1v1h-1z"/></svg>Quét tem</button>
    <button class="nav-btn" id="btnList" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Danh sách</button>
    <button class="nav-btn" id="btnAnHien" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Ẩn / hiện</button>
    <button class="nav-btn" id="btnHienHet" type="button">

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function normalizeText(s) {
    var str = String(s || '');
    if (str.normalize) str = str.normalize('NFC');
    return str.trim().replace(/\s+/g, ' ').toLowerCase();
  }
  function fmt(v) {
    var n = Math.round(Number(v) * 10) / 10;
    return (n % 1 === 0) ? n.toFixed(0) : n.toFixed(1);
  }
  var toastTimer = null;
  function showToast(msg, type, ms) {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + (type || 'info') + ' show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast ' + (type || 'info'); }, ms || 3000);
  }
  function showAlert(title, msg, coNutChup) {
    $('alertTitle').textContent = title;
    $('alertMsg').textContent = msg;
    $('btnAlertChup').style.display = coNutChup ? 'block' : 'none';
    alertModal.classList.add('show');
  }
  $('btnCloseAlert').addEventListener('click', function () { alertModal.classList.remove('show'); });

  // ====== TOÁN MA TRẬN (cột-trước) ======
  function mat4Mul(a, b) {
    var out = new Float32Array(16);
    for (var c = 0; c < 4; c++) {
      var b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
      out[c * 4]     = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
      out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
      out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
      out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
    }
    return out;
  }
  function mat4Perspective(fovy, aspect, near, far) {
    var f = 1.0 / Math.tan(fovy * 0.5), nf = 1.0 / (near - far);
    var o = new Float32Array(16);
    o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf; o[11] = -1; o[14] = 2 * far * near * nf;
    return o;
  }
  function mat4LookAt(eye, t, up) {
    var zx = eye[0] - t[0], zy = eye[1] - t[1], zz = eye[2] - t[2];
    var zl = Math.sqrt(zx * zx + zy * zy + zz * zz) || 1; zx /= zl; zy /= zl; zz /= zl;
    var xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    var xl = Math.sqrt(xx * xx + xy * xy + xz * xz) || 1; xx /= xl; xy /= xl; xz /= xl;
    var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    var o = new Float32Array(16);
    o[0] = xx; o[1] = yx; o[2] = zx; o[4] = xy; o[5] = yy; o[6] = zy; o[8] = xz; o[9] = yz; o[10] = zz;
    o[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    o[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    o[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    o[15] = 1;
    return o;
  }

  // ====== WEBGL ======
  var gl = null, progSolid, progEdge, progPick, progPl;
  var buf = {};
  var pickFbo = null, pickTex = null, pickDepth = null, pickW = 0, pickH = 0;

  function compileShader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) || 'Shader');
    return sh;
  }
  function createProgram(vs, fs, attrs, unis) {
    var p = gl.createProgram();
    gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'Link');
    p.a = {}; p.u = {};
    for (var i = 0; i < attrs.length; i++) p.a[attrs[i]] = gl.getAttribLocation(p, attrs[i]);
    for (var j = 0; j < unis.length; j++) p.u[unis[j]] = gl.getUniformLocation(p, unis[j]);
    return p;
  }

  function initWebGL() {
    var opts = { antialias: true, alpha: true, preserveDrawingBuffer: false };
    gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) {
      showAlert('Không hỗ trợ WebGL', 'Trình duyệt trên máy này không hiển thị được 3D.');
      return false;
    }
    // u_pass: 0 = bình thường, 1 = chỉ tấm đang chọn (cam), 2 = tấm không chọn, vẽ mờ
    progSolid = createProgram([
      'attribute vec3 a_pos; attribute vec3 a_norm; attribute vec3 a_col; attribute float a_sel;',
      'uniform mat4 u_mvp; varying vec3 v_norm; varying vec3 v_col; varying float v_sel;',
      'void main(){ gl_Position = u_mvp * vec4(a_pos,1.0); v_norm=a_norm; v_col=a_col; v_sel=a_sel; }'
    ].join('\n'), [
      'precision mediump float;',
      'varying vec3 v_norm; varying vec3 v_col; varying float v_sel;',
      'uniform float u_pass; uniform float u_alpha;',
      'void main(){',
      '  if (u_pass > 0.5 && u_pass < 1.5 && v_sel < 0.5) discard;',
      '  if (u_pass > 1.5 && v_sel > 0.5) discard;',
      '  vec3 n = normalize(gl_FrontFacing ? v_norm : -v_norm);',
      '  float d1 = max(dot(n, normalize(vec3(0.45,-0.65,0.80))), 0.0);',
      '  float d2 = max(dot(n, normalize(vec3(-0.60,0.50,-0.30))), 0.0);',
      '  float shade = 0.44 + 0.40*d1 + 0.14*d2 + 0.08*(0.5+0.5*n.z);',
      '  if (u_pass > 0.5 && u_pass < 1.5) {',
      '    gl_FragColor = vec4(vec3(0.92,0.47,0.29) * clamp(shade*1.06, 0.55, 1.15), 1.0);',
      '  } else if (u_pass > 1.5) {',
      '    gl_FragColor = vec4(mix(v_col, vec3(0.84,0.84,0.86), 0.55) * clamp(shade, 0.5, 1.05), u_alpha);',
      '  } else {',
      '    gl_FragColor = vec4(v_col * clamp(shade, 0.35, 1.08), 1.0);',
      '  }',
      '}'
    ].join('\n'), ['a_pos', 'a_norm', 'a_col', 'a_sel'], ['u_mvp', 'u_pass', 'u_alpha']);

    progEdge = createProgram([
      'attribute vec3 a_pos; attribute float a_sel; uniform mat4 u_mvp; varying float v_sel;',
      'void main(){ gl_Position = u_mvp * vec4(a_pos,1.0); v_sel=a_sel; }'
    ].join('\n'), [
      'precision mediump float; varying float v_sel; uniform float u_pass; uniform float u_alpha;',
      'void main(){',
      '  if (u_pass > 0.5 && u_pass < 1.5 && v_sel < 0.5) discard;',
      '  if (u_pass > 1.5 && v_sel > 0.5) discard;',
      '  if (u_pass > 0.5 && u_pass < 1.5) gl_FragColor = vec4(0.42,0.14,0.05,0.95);',
      '  else if (u_pass > 1.5) gl_FragColor = vec4(0.28,0.28,0.32,u_alpha);',
      '  else gl_FragColor = vec4(0.18,0.19,0.22,0.62);',
      '}'
    ].join('\n'), ['a_pos', 'a_sel'], ['u_mvp', 'u_pass', 'u_alpha']);

    progPick = createProgram([
      'attribute vec3 a_pos; attribute float a_bid; uniform mat4 u_mvp; varying vec3 v_c;',
      'void main(){ gl_Position = u_mvp * vec4(a_pos,1.0); float id = a_bid + 1.0;',
      '  v_c = vec3(mod(id,256.0), mod(floor(id/256.0),256.0), floor(id/65536.0)) / 255.0; }'
    ].join('\n'), 'precision mediump float; varying vec3 v_c; void main(){ gl_FragColor = vec4(v_c,1.0); }',
    ['a_pos', 'a_bid'], ['u_mvp']);

    progPl = createProgram([
      'attribute vec3 a_pos; attribute vec3 a_col; uniform mat4 u_mvp; varying vec3 v_col;',
      'void main(){ gl_Position = u_mvp * vec4(a_pos,1.0); v_col=a_col; }'
    ].join('\n'), 'precision mediump float; varying vec3 v_col; uniform float u_k; void main(){ gl_FragColor = vec4(v_col*u_k,1.0); }',
    ['a_pos', 'a_col'], ['u_mvp', 'u_k']);
    return true;
  }

  function initPickingFbo(w, h) {
    pickW = w; pickH = h;
    if (!pickFbo) {
      pickFbo = gl.createFramebuffer(); pickTex = gl.createTexture(); pickDepth = gl.createRenderbuffer();
    }
    gl.bindTexture(gl.TEXTURE_2D, pickTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindRenderbuffer(gl.RENDERBUFFER, pickDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pickFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pickTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, pickDepth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  function taoBuffer(arr, dynamic) {
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, arr, dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
    return b;
  }

  // ====== DỮ LIỆU CẢNH ======
  var boards = [];          // mỗi tấm
  var cucList = [];         // cục tủ
  var tagList = [];         // player: { ten, mau, hien, dai_m }
  var plChunks = [];        // { tag, bid, ls, lc, ts, tc } đoạn player trong buffer
  var modelCenter = [0, 0, 0], modelRadius = 1000;
  var triPosCPU = null, triSelCPU = null, edgeSelCPU = null;

  // Loại tấm theo tên (để ẩn/hiện như Ecohome). Thứ tự ưu tiên: Nẹp trước Cánh ("nẹp cánh" là nẹp).
  var LOAI = [
    { key: 'nep',   ten: 'Nẹp',   tu: ['nẹp'] },
    { key: 'canh',  ten: 'Cánh',  tu: ['cánh'] },
    { key: 'hau',   ten: 'Hậu',   tu: ['hậu'] },
    { key: 'tran',  ten: 'Trần',  tu: ['trần'] },
    { key: 'tuong', ten: 'Tường', tu: ['tường'] },
    { key: 'khac',  ten: 'Tấm khác', tu: [] }
  ];
  var loaiHien = { nep: true, canh: true, hau: true, tran: true, tuong: true, khac: true };
  function phanLoai(ten) {
    var tokens = normalizeText(ten).split(/[\s\-_.,;:()\/\\#+*=0-9]+/);
    for (var i = 0; i < LOAI.length; i++) {
      for (var j = 0; j < LOAI[i].tu.length; j++) {
        if (tokens.indexOf(LOAI[i].tu[j]) !== -1) return LOAI[i].key;
      }
    }
    return 'khac';
  }

  // Tên dạng "Tab - Cánh 3 - PN1": tiền tố = phần đầu (khi có >= 2 phần), hậu tố/phòng = phần cuối (khi có >= 3 phần)
  function tachTen(ten) {
    var parts = String(ten || '').split(/\s*-\s*/);
    var out = { tien: '', hau: '' };
    for (var i = parts.length - 1; i >= 0; i--) if (!parts[i]) parts.splice(i, 1);
    if (parts.length >= 2) out.tien = parts[0].trim();
    if (parts.length >= 3) out.hau = parts[parts.length - 1].trim();
    return out;
  }

  var MAU_PLAYER = [[230,184,0],[123,63,191],[30,136,229],[229,57,53],[0,137,123],[244,81,30],[109,76,65],[57,73,171]];

  function buildScene(data) {
    var luoiArr = data.luoi || [];
    var raw = data.tam || [];
    var i, j;

    // Nhóm theo cục để buffer của 1 cục nằm liền nhau
    var cucMap = {};
    cucList = [];
    for (i = 0; i < raw.length; i++) {
      var cname = raw[i].cuc || 'Ngoài nhóm';
      if (!cucMap[cname]) {
        cucMap[cname] = { index: cucList.length, name: cname, visible: true, items: [] };
        cucList.push(cucMap[cname]);
      }
      cucMap[cname].items.push(raw[i]);
    }

    // Danh sách player
    var tagMap = {};
    function tagIndex(ten) {
      if (tagMap[ten] === undefined) {
        tagMap[ten] = tagList.length;
        tagList.push({ ten: ten, mau: MAU_PLAYER[tagList.length % MAU_PLAYER.length], hien: true, dai: 0 });
      }
      return tagMap[ten];
    }

    // Đếm
    var nTri = 0, nEdge = 0, nPlL = 0, nPlT = 0, c, k, items;
    for (c = 0; c < cucList.length; c++) {
      items = cucList[c].items;
      for (j = 0; j < items.length; j++) {
        var me = luoiArr[items[j].lid];
        if (!me) continue;
        nTri += me.t.length; nEdge += me.e.length;
        if (me.p) for (k in me.p) { nPlL += me.p[k].e.length; nPlT += me.p[k].t.length; }
      }
    }

    var triPos = new Float32Array(nTri * 3), triNorm = new Float32Array(nTri * 3);
    var triCol = new Uint8Array(nTri * 3), triBid = new Float32Array(nTri);
    triSelCPU = new Float32Array(nTri);
    var edgePos = new Float32Array(nEdge * 3);
    edgeSelCPU = new Float32Array(nEdge);
    var plPos = new Float32Array((nPlL + nPlT) * 3), plCol = new Uint8Array((nPlL + nPlT) * 3);

    var tv = 0, ev = 0, pv = 0;
    var mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    boards = []; plChunks = [];

    function ghiTamGiac(wv, tris, flip, cr, cg, cb, bid, toPos, toNorm, toCol, cursor, toBid) {
      for (var ti = 0; ti < tris.length; ti += 3) {
        var i0 = tris[ti] * 3, i1 = tris[flip ? ti + 2 : ti + 1] * 3, i2 = tris[flip ? ti + 1 : ti + 2] * 3;
        var x0 = wv[i0], y0 = wv[i0 + 1], z0 = wv[i0 + 2];
        var x1 = wv[i1], y1 = wv[i1 + 1], z1 = wv[i1 + 2];
        var x2 = wv[i2], y2 = wv[i2 + 1], z2 = wv[i2 + 2];
        var o = cursor * 3;
        toPos[o] = x0; toPos[o + 1] = y0; toPos[o + 2] = z0;
        toPos[o + 3] = x1; toPos[o + 4] = y1; toPos[o + 5] = z1;
        toPos[o + 6] = x2; toPos[o + 7] = y2; toPos[o + 8] = z2;
        if (toNorm) {
          var ux = x1 - x0, uy = y1 - y0, uz = z1 - z0, vx = x2 - x0, vy = y2 - y0, vz = z2 - z0;
          var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
          var nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
          nx /= nl; ny /= nl; nz /= nl;
          for (var q = 0; q < 3; q++) { toNorm[o + q * 3] = nx; toNorm[o + q * 3 + 1] = ny; toNorm[o + q * 3 + 2] = nz; }
        }
        for (var r = 0; r < 3; r++) { toCol[o + r * 3] = cr; toCol[o + r * 3 + 1] = cg; toCol[o + r * 3 + 2] = cb; }
        if (toBid) { toBid[cursor] = bid; toBid[cursor + 1] = bid; toBid[cursor + 2] = bid; }
        cursor += 3;
      }
      return cursor;
    }

    for (c = 0; c < cucList.length; c++) {
      var cuc = cucList[c];
      for (j = 0; j < cuc.items.length; j++) {
        var src = cuc.items[j];
        var mesh = luoiArr[src.lid];
        if (!mesh) continue;
        var bid = boards.length;
        var m = src.m;
        var det = m[0] * (m[5] * m[10] - m[9] * m[6]) - m[4] * (m[1] * m[10] - m[9] * m[2]) + m[8] * (m[1] * m[6] - m[5] * m[2]);
        var flip = det < 0;

        var lv = mesh.v, wv = new Float32Array(lv.length);
        for (var vi = 0; vi < lv.length; vi += 3) {
          var lx = lv[vi], ly = lv[vi + 1], lz = lv[vi + 2];
          wv[vi]     = m[0] * lx + m[4] * ly + m[8]  * lz + m[12];
          wv[vi + 1] = m[1] * lx + m[5] * ly + m[9]  * lz + m[13];
          wv[vi + 2] = m[2] * lx + m[6] * ly + m[10] * lz + m[14];
        }
        // Khung bao chỉ tính theo mặt tấm (không tính player thò ra ngoài)
        var bmn = [Infinity, Infinity, Infinity], bmx = [-Infinity, -Infinity, -Infinity];
        for (var ti = 0; ti < mesh.t.length; ti++) {
          var vb = mesh.t[ti] * 3;
          for (var a = 0; a < 3; a++) {
            if (wv[vb + a] < bmn[a]) bmn[a] = wv[vb + a];
            if (wv[vb + a] > bmx[a]) bmx[a] = wv[vb + a];
          }
        }
        for (a = 0; a < 3; a++) { if (bmn[a] < mn[a]) mn[a] = bmn[a]; if (bmx[a] > mx[a]) mx[a] = bmx[a]; }

        var rgb = src.mau || [212, 212, 212];
        var ts = tv;
        tv = ghiTamGiac(wv, mesh.t, flip, rgb[0] & 255, rgb[1] & 255, rgb[2] & 255, bid, triPos, triNorm, triCol, tv, triBid);
        var es = ev;
        for (var ei = 0; ei < mesh.e.length; ei += 2) {
          var ea = mesh.e[ei] * 3, eb = mesh.e[ei + 1] * 3, eo = ev * 3;
          edgePos[eo] = wv[ea]; edgePos[eo + 1] = wv[ea + 1]; edgePos[eo + 2] = wv[ea + 2];
          edgePos[eo + 3] = wv[eb]; edgePos[eo + 4] = wv[eb + 1]; edgePos[eo + 5] = wv[eb + 2];
          ev += 2;
        }

        var plTen = [];
        if (mesh.p) {
          for (k in mesh.p) {
            var tg = tagIndex(k), pm = mesh.p[k], col = tagList[tg].mau;
            plTen.push(k);
            var ls = pv;
            for (var pi = 0; pi < pm.e.length; pi += 2) {
              var pa = pm.e[pi] * 3, pb = pm.e[pi + 1] * 3, po = pv * 3;
              plPos[po] = wv[pa]; plPos[po + 1] = wv[pa + 1]; plPos[po + 2] = wv[pa + 2];
              plPos[po + 3] = wv[pb]; plPos[po + 4] = wv[pb + 1]; plPos[po + 5] = wv[pb + 2];
              for (var cc = 0; cc < 6; cc++) plCol[po + cc] = col[cc % 3];
              var dx = wv[pb] - wv[pa], dy = wv[pb + 1] - wv[pa + 1], dz = wv[pb + 2] - wv[pa + 2];
              tagList[tg].dai += Math.sqrt(dx * dx + dy * dy + dz * dz);
              pv += 2;
            }
            var lc = pv - ls;
            var tsP = pv;
            pv = ghiTamGiac(wv, pm.t, flip, col[0], col[1], col[2], bid, plPos, null, plCol, pv, null);
            plChunks.push({ tag: tg, bid: bid, ls: ls, lc: lc, ts: tsP, tc: pv - tsP });
          }
        }

        boards.push({
          bid: bid, so: (src.so === undefined ? null : src.so), ten: src.ten || '(Không tên)',
          kt: src.kt || [0, 0, 0], vl: src.vl || 'Mặc định', mau: rgb, cuc: cuc.name, cucIndex: c,
          loai: phanLoai(src.ten || ''), an: false, tien: tachTen(src.ten).tien, hau: tachTen(src.ten).hau, hien: true, player: plTen,
          bmn: bmn, bmx: bmx,
          center: [(bmn[0] + bmx[0]) / 2, (bmn[1] + bmx[1]) / 2, (bmn[2] + bmx[2]) / 2],
          diag: Math.sqrt(Math.pow(bmx[0] - bmn[0], 2) + Math.pow(bmx[1] - bmn[1], 2) + Math.pow(bmx[2] - bmn[2], 2)) || 100,
          ts: ts, tc: tv - ts, es: es, ec: ev - es
        });
      }
    }

    if (isFinite(mn[0])) {
      modelCenter = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
      modelRadius = Math.max(200, Math.sqrt(Math.pow(mx[0] - mn[0], 2) + Math.pow(mx[1] - mn[1], 2) + Math.pow(mx[2] - mn[2], 2)) / 2);
    }

    triPosCPU = triPos;
    cpu = { triPos: triPos, triNorm: triNorm, triCol: triCol, triBid: triBid, edgePos: edgePos, plPos: plPos, plCol: plCol };
    napBufferGPU();
  }

  // Giữ bản dữ liệu trên RAM để nạp lại khi điện thoại làm mất WebGL (vd: lúc mở camera)
  var cpu = null;
  function napBufferGPU() {
    buf.triPos = taoBuffer(cpu.triPos);
    buf.triNorm = taoBuffer(cpu.triNorm);
    buf.triCol = taoBuffer(cpu.triCol);
    buf.triBid = taoBuffer(cpu.triBid);
    buf.triSel = taoBuffer(triSelCPU, true);
    buf.edgePos = taoBuffer(cpu.edgePos);
    buf.edgeSel = taoBuffer(edgeSelCPU, true);
    buf.plPos = taoBuffer(cpu.plPos);
    buf.plCol = taoBuffer(cpu.plCol);
  }

  // ====== ẨN / HIỆN: gom các tấm đang hiện thành ít lần vẽ ======
  var runs = { tri: [], edge: [], plL: [], plT: [] };
  function themRun(list, s, n) {
    if (n <= 0) return;
    var last = list[list.length - 1];
    if (last && last.s + last.n === s) last.n += n; else list.push({ s: s, n: n });
  }
  function capNhatHien() {
    runs = { tri: [], edge: [], plL: [], plT: [] };
    for (var i = 0; i < boards.length; i++) {
      var b = boards[i];
      b.hien = !b.an && cucList[b.cucIndex].visible && loaiHien[b.loai] !== false;
      if (!b.hien) continue;
      themRun(runs.tri, b.ts, b.tc);
      themRun(runs.edge, b.es, b.ec);
    }
    for (var j = 0; j < plChunks.length; j++) {
      var ch = plChunks[j];
      if (!boards[ch.bid].hien || !tagList[ch.tag].hien) continue;
      themRun(runs.plL, ch.ls, ch.lc);
      themRun(runs.plT, ch.ts, ch.tc);
    }
    // Tấm đang chọn mà bị ẩn thì bỏ chọn
    var con = [];
    for (var s = 0; s < selList.length; s++) if (boards[selList[s]].hien) con.push(selList[s]);
    if (con.length !== selList.length) datChon(con);
    requestRender();
  }

  // ====== CHỌN (1 tấm hoặc cả nhóm) ======
  var selList = [];
  var selMap = {};
  function datChon(bids) {
    var doi = {}, i, b;
    for (i = 0; i < selList.length; i++) doi[selList[i]] = true;
    for (i = 0; i < bids.length; i++) doi[bids[i]] = true;
    selMap = {};
    selList = bids.slice();
    for (i = 0; i < bids.length; i++) selMap[bids[i]] = true;
    for (var key in doi) {
      b = boards[key];
      var v = selMap[key] ? 1 : 0;
      if (b.tc > 0) {
        for (i = b.ts; i < b.ts + b.tc; i++) triSelCPU[i] = v;
        gl.bindBuffer(gl.ARRAY_BUFFER, buf.triSel);
        gl.bufferSubData(gl.ARRAY_BUFFER, b.ts * 4, triSelCPU.subarray(b.ts, b.ts + b.tc));
      }
      if (b.ec > 0) {
        for (i = b.es; i < b.es + b.ec; i++) edgeSelCPU[i] = v;
        gl.bindBuffer(gl.ARRAY_BUFFER, buf.edgeSel);
        gl.bufferSubData(gl.ARRAY_BUFFER, b.es * 4, edgeSelCPU.subarray(b.es, b.es + b.ec));
      }
    }
    requestRender();
  }

  // ====== CAMERA (Z hướng lên như SketchUp) ======
  var cam = { tx: 0, ty: 0, tz: 0, yaw: -Math.PI * 0.36, pitch: 0.32, dist: 2500 };
  var initCam = null, camAnim = null, needsRender = true;
  var xray = false;

  function camEye() {
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    return [cam.tx + cam.dist * cp * Math.cos(cam.yaw), cam.ty + cam.dist * cp * Math.sin(cam.yaw), cam.tz + cam.dist * sp];
  }
  function computeMvp(aspect) {
    var near = Math.max(2.0, cam.dist * 0.015);
    var far = Math.max(cam.dist + modelRadius * 4.0, modelRadius * 8.0);
    return mat4Mul(mat4Perspective(FOVY, aspect, near, far), mat4LookAt(camEye(), [cam.tx, cam.ty, cam.tz], [0, 0, 1]));
  }
  function requestRender() { needsRender = true; }
  function fitDist(r) {
    var aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight) || 1;
    var fovx = 2 * Math.atan(Math.tan(FOVY / 2) * aspect);
    return (r / Math.sin(Math.min(FOVY, fovx) / 2)) * 1.08;
  }
  function animateCameraTo(goal, ms) {
    camAnim = {
      start: performance.now(), duration: ms || 400,
      from: { tx: cam.tx, ty: cam.ty, tz: cam.tz, yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist },
      to: {
        tx: goal.tx, ty: goal.ty, tz: goal.tz, dist: goal.dist,
        yaw: goal.yaw !== undefined ? goal.yaw : cam.yaw, pitch: goal.pitch !== undefined ? goal.pitch : cam.pitch
      }
    };
    requestRender();
  }
  // Bay tới khung bao; đặt tấm vào khoảng trống giữa ô tìm và thẻ thông tin (không bị thẻ che)
  function bayToi(bmn, bmx) {
    var r = Math.sqrt(Math.pow(bmx[0] - bmn[0], 2) + Math.pow(bmx[1] - bmn[1], 2) + Math.pow(bmx[2] - bmn[2], 2)) / 2;
    var H = canvas.clientHeight || window.innerHeight;
    var tren = 130;
    var duoi = H - 132;
    if (infoCard.classList.contains('show')) duoi = Math.min(duoi, infoCard.getBoundingClientRect().top);
    var cao = Math.max(H * 0.25, duoi - tren - 16);
    var dist = Math.max(260, Math.min(fitDist(modelRadius), fitDist(r || 50) * H / cao));
    var lech = H / 2 - (tren + duoi) / 2;               // tấm cần lên trên bao nhiêu px
    var mmMoiPx = 2 * dist * Math.tan(FOVY / 2) / H;
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var u = [-sp * cy, -sp * sy, cp];
    var k = -lech * mmMoiPx;
    animateCameraTo({
      tx: (bmn[0] + bmx[0]) / 2 + u[0] * k, ty: (bmn[1] + bmx[1]) / 2 + u[1] * k, tz: (bmn[2] + bmx[2]) / 2 + u[2] * k,
      dist: dist
    }, 420);
  }

  // ====== VẼ ======
  function bat(prog, name, b, size, type, norm) {
    var loc = prog.a[name];
    if (loc < 0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, type || gl.FLOAT, !!norm, 0, 0);
  }
  function tatAttrib() { for (var i = 0; i < 6; i++) gl.disableVertexAttribArray(i); }
  function veRuns(mode, list) { for (var i = 0; i < list.length; i++) gl.drawArrays(mode, list[i].s, list[i].n); }

  function veMat(mvp, pass, alpha) {
    tatAttrib();
    gl.useProgram(progSolid);
    bat(progSolid, 'a_pos', buf.triPos, 3);
    bat(progSolid, 'a_norm', buf.triNorm, 3);
    bat(progSolid, 'a_col', buf.triCol, 3, gl.UNSIGNED_BYTE, true);
    bat(progSolid, 'a_sel', buf.triSel, 1);
    gl.uniformMatrix4fv(progSolid.u.u_mvp, false, mvp);
    gl.uniform1f(progSolid.u.u_pass, pass);
    gl.uniform1f(progSolid.u.u_alpha, alpha || 1);
    veRuns(gl.TRIANGLES, runs.tri);
  }
  function veCanh(mvp, pass, alpha) {
    tatAttrib();
    gl.useProgram(progEdge);
    bat(progEdge, 'a_pos', buf.edgePos, 3);
    bat(progEdge, 'a_sel', buf.edgeSel, 1);
    gl.uniformMatrix4fv(progEdge.u.u_mvp, false, mvp);
    gl.uniform1f(progEdge.u.u_pass, pass);
    gl.uniform1f(progEdge.u.u_alpha, alpha || 1);
    veRuns(gl.LINES, runs.edge);
  }
  function vePlayer(mvp) {
    if (!caiDat.player || (!runs.plL.length && !runs.plT.length)) return;
    tatAttrib();
    gl.useProgram(progPl);
    bat(progPl, 'a_pos', buf.plPos, 3);
    bat(progPl, 'a_col', buf.plCol, 3, gl.UNSIGNED_BYTE, true);
    gl.uniformMatrix4fv(progPl.u.u_mvp, false, mvp);
    // Mặt player kéo lên trước mặt tấm một chút để không bị lẫn
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(-1.0, -2.0);
    gl.uniform1f(progPl.u.u_k, 0.92);
    veRuns(gl.TRIANGLES, runs.plT);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    gl.uniform1f(progPl.u.u_k, 0.75);
    veRuns(gl.LINES, runs.plL);
  }

  function render() {
    if (!gl) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.depthMask(true);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    var mvp = computeMvp(canvas.width / Math.max(1, canvas.height));
    var mo = xray || selList.length > 0;
    var alpha = Math.max(0.05, Math.min(0.9, caiDat.xray / 100));

    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(1.0, 1.0);
    gl.disable(gl.BLEND);
    if (!mo) {
      veMat(mvp, 0);
      gl.disable(gl.POLYGON_OFFSET_FILL);
      vePlayer(mvp);
      if (caiDat.vien) { gl.enable(gl.BLEND); veCanh(mvp, 0); }
    } else {
      if (selList.length) veMat(mvp, 1);
      gl.disable(gl.POLYGON_OFFSET_FILL);
      gl.enable(gl.BLEND);
      if (selList.length) veCanh(mvp, 1);
      vePlayer(mvp);
      gl.enable(gl.BLEND);
      gl.depthMask(false);
      gl.enable(gl.POLYGON_OFFSET_FILL);
      gl.polygonOffset(1.0, 1.0);
      veMat(mvp, 2, alpha);
      gl.disable(gl.POLYGON_OFFSET_FILL);
      if (caiDat.vien) veCanh(mvp, 2, Math.min(0.5, alpha * 0.9));
      gl.depthMask(true);
    }
    gl.disable(gl.BLEND);
    veOverlay(mvp);
  }

  // ====== CHẠM: tìm tấm dưới ngón tay ======
  function pickBoardAt(clientX, clientY) {
    if (!gl || !boards.length) return -1;
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
    if (pickW !== w || pickH !== h) initPickingFbo(w, h);
    var px = Math.floor(clientX - rect.left), py = h - 1 - Math.floor(clientY - rect.top);
    if (px < 0 || py < 0 || px >= w || py >= h) return -1;
    gl.bindFramebuffer(gl.FRAMEBUFFER, pickFbo);
    gl.viewport(0, 0, w, h);
    gl.disable(gl.BLEND); gl.disable(gl.DITHER);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    tatAttrib();
    gl.useProgram(progPick);
    bat(progPick, 'a_pos', buf.triPos, 3);
    bat(progPick, 'a_bid', buf.triBid, 1);
    gl.uniformMatrix4fv(progPick.u.u_mvp, false, computeMvp(w / h));
    veRuns(gl.TRIANGLES, runs.tri);
    var px4 = new Uint8Array(4);
    gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.enable(gl.DITHER);
    requestRender();
    var id = px4[0] + px4[1] * 256 + px4[2] * 65536;
    return (id <= 0 || id > boards.length) ? -1 : id - 1;
  }

  // ====== ĐO KÍCH THƯỚC ======
  var doDiem = [];
  function chieuLenManHinh(mvp, p) {
    var x = p[0], y = p[1], z = p[2];
    var cx = mvp[0] * x + mvp[4] * y + mvp[8] * z + mvp[12];
    var cy = mvp[1] * x + mvp[5] * y + mvp[9] * z + mvp[13];
    var cw = mvp[3] * x + mvp[7] * y + mvp[11] * z + mvp[15];
    if (cw <= 0.0001) return null;
    return [(cx / cw * 0.5 + 0.5) * canvas.clientWidth, (1 - (cy / cw * 0.5 + 0.5)) * canvas.clientHeight];
  }
  function tiaTuManHinh(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var nx = (clientX - rect.left) / rect.width * 2 - 1, ny = 1 - (clientY - rect.top) / rect.height * 2;
    var eye = camEye();
    var f = [cam.tx - eye[0], cam.ty - eye[1], cam.tz - eye[2]];
    var fl = Math.sqrt(f[0] * f[0] + f[1] * f[1] + f[2] * f[2]); f = [f[0] / fl, f[1] / fl, f[2] / fl];
    var r = [f[1], -f[0], 0]; var rl = Math.sqrt(r[0] * r[0] + r[1] * r[1]) || 1; r = [r[0] / rl, r[1] / rl, 0];
    var u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    var t = Math.tan(FOVY / 2), asp = rect.width / rect.height;
    var d = [f[0] + r[0] * nx * t * asp + u[0] * ny * t, f[1] + r[1] * nx * t * asp + u[1] * ny * t, f[2] + r[2] * nx * t * asp + u[2] * ny * t];
    return { o: eye, d: d };
  }
  // Điểm trên tấm dưới ngón tay; gần góc / đỉnh tấm (dưới 24 px) thì bắt dính vào đỉnh
  function diemTrenTam(bid, clientX, clientY) {
    var b = boards[bid], ray = tiaTuManHinh(clientX, clientY);
    var o = ray.o, d = ray.d, best = Infinity, P = triPosCPU;
    for (var i = b.ts; i < b.ts + b.tc; i += 3) {
      var a = i * 3;
      var e1x = P[a + 3] - P[a], e1y = P[a + 4] - P[a + 1], e1z = P[a + 5] - P[a + 2];
      var e2x = P[a + 6] - P[a], e2y = P[a + 7] - P[a + 1], e2z = P[a + 8] - P[a + 2];
      var px = d[1] * e2z - d[2] * e2y, py = d[2] * e2x - d[0] * e2z, pz = d[0] * e2y - d[1] * e2x;
      var det = e1x * px + e1y * py + e1z * pz;
      if (Math.abs(det) < 1e-9) continue;
      var inv = 1 / det;
      var sx = o[0] - P[a], sy = o[1] - P[a + 1], sz = o[2] - P[a + 2];
      var uu = (sx * px + sy * py + sz * pz) * inv;
      if (uu < 0 || uu > 1) continue;
      var qx = sy * e1z - sz * e1y, qy = sz * e1x - sx * e1z, qz = sx * e1y - sy * e1x;
      var vv = (d[0] * qx + d[1] * qy + d[2] * qz) * inv;
      if (vv < 0 || uu + vv > 1) continue;
      var tt = (e2x * qx + e2y * qy + e2z * qz) * inv;
      if (tt > 0 && tt < best) best = tt;
    }
    var rect = canvas.getBoundingClientRect();
    var mx = clientX - rect.left, my = clientY - rect.top;
    var mvp = computeMvp(canvas.width / Math.max(1, canvas.height));
    var snap = null, snapD = 24;
    for (var k = b.ts * 3; k < (b.ts + b.tc) * 3; k += 3) {
      var s = chieuLenManHinh(mvp, [P[k], P[k + 1], P[k + 2]]);
      if (!s) continue;
      var dd = Math.sqrt((s[0] - mx) * (s[0] - mx) + (s[1] - my) * (s[1] - my));
      if (dd < snapD) { snapD = dd; snap = [P[k], P[k + 1], P[k + 2]]; }
    }
    if (snap) return { p: snap, bat: true };
    if (best < Infinity) return { p: [o[0] + d[0] * best, o[1] + d[1] * best, o[2] + d[2] * best], bat: false };
    return null;
  }
  function capNhatDoBox() {
    if (tool !== 'do') { doBox.classList.remove('show'); return; }
    doBox.classList.add('show');
    if (doDiem.length === 0) doBox.innerHTML = 'Chạm điểm thứ 1 trên tấm<div class="phu">Gần góc tấm sẽ tự bắt vào góc</div>';
    else if (doDiem.length === 1) doBox.innerHTML = 'Chạm điểm thứ 2';
    else {
      var a = doDiem[0].p, b = doDiem[1].p;
      var dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
      doBox.innerHTML = '<b>' + fmt(Math.sqrt(dx * dx + dy * dy + dz * dz)) + ' mm</b>' +
        '<div class="phu">Ngang X ' + fmt(Math.abs(dx)) + ' · Ngang Y ' + fmt(Math.abs(dy)) + ' · Cao Z ' + fmt(Math.abs(dz)) +
        '<br>Chạm tiếp để đo lần mới</div>';
    }
  }
  function xuLyDo(clientX, clientY) {
    var bid = pickBoardAt(clientX, clientY);
    if (bid < 0) { showToast('Chạm vào tấm để đặt điểm đo', 'info'); return; }
    var p = diemTrenTam(bid, clientX, clientY);
    if (!p) return;
    if (doDiem.length >= 2) doDiem = [];
    doDiem.push(p);
    capNhatDoBox();
    requestRender();
  }
  function veOverlay(mvp) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    ov.setTransform(dpr, 0, 0, dpr, 0, 0);
    ov.clearRect(0, 0, ovCanvas.width, ovCanvas.height);
    if (tool !== 'do' || !doDiem.length) return;
    var s = [];
    for (var i = 0; i < doDiem.length; i++) s.push(chieuLenManHinh(mvp, doDiem[i].p));
    if (s.length === 2 && s[0] && s[1]) {
      ov.strokeStyle = '#C26142'; ov.lineWidth = 3; ov.setLineDash([8, 5]);
      ov.beginPath(); ov.moveTo(s[0][0], s[0][1]); ov.lineTo(s[1][0], s[1][1]); ov.stroke();
      ov.setLineDash([]);
      var a = doDiem[0].p, b = doDiem[1].p;
      var txt = fmt(Math.sqrt(Math.pow(b[0] - a[0], 2) + Math.pow(b[1] - a[1], 2) + Math.pow(b[2] - a[2], 2))) + ' mm';
      var mx = (s[0][0] + s[1][0]) / 2, my = (s[0][1] + s[1][1]) / 2;
      ov.font = 'bold 15px -apple-system, Roboto, Arial, sans-serif';
      var w = ov.measureText(txt).width + 16;
      ov.fillStyle = '#23272D'; ov.fillRect(mx - w / 2, my - 14, w, 28);
      ov.fillStyle = '#FFFFFF'; ov.textAlign = 'center'; ov.textBaseline = 'middle'; ov.fillText(txt, mx, my);
    }
    for (var j = 0; j < s.length; j++) {
      if (!s[j]) continue;
      ov.beginPath(); ov.arc(s[j][0], s[j][1], 7, 0, Math.PI * 2);
      ov.fillStyle = doDiem[j].bat ? '#2E7D32' : '#D97757'; ov.fill();
      ov.lineWidth = 2.5; ov.strokeStyle = '#FFFFFF'; ov.stroke();
    }
  }

  // ====== CÔNG CỤ (chế độ chạm) ======
  var tool = 'chon';
  var TOOLS = { chon: 'tool_chon', nhom: 'tool_nhom', an: 'tool_an', do: 'tool_do' };
  function datTool(t) {
    tool = t;
    for (var k in TOOLS) $(TOOLS[k]).classList.toggle('on', k === t);
    if (t !== 'do') doDiem = [];
    if (t === 'an') showToast('Chạm vào tấm nào thì ẩn tấm đó. Bấm "Hiện tất cả" để hiện lại.', 'info', 3500);
    if (t === 'do') { datChon([]); showCard(null); }
    capNhatDoBox();
    requestRender();
  }
  $('tool_chon').addEventListener('click', function () { datTool('chon'); });
  $('tool_nhom').addEventListener('click', function () { datTool('nhom'); moChonNhom(); });
  $('tool_an').addEventListener('click', function () { datTool('an'); });
  $('tool_do').addEventListener('click', function () { datTool(tool === 'do' ? 'chon' : 'do'); });

  $('btnXray').addEventListener('click', function () {
    xray = !xray;
    $('btnXray').classList.toggle('on', xray);
    requestRender();
  });

  function xuLyCham(clientX, clientY) {
    if (tool === 'do') { xuLyDo(clientX, clientY); return; }
    var bid = pickBoardAt(clientX, clientY);
    if (tool === 'an') {
      if (bid < 0) return;
      boards[bid].an = true;
      capNhatHien();
      var n = 0; for (var i = 0; i < boards.length; i++) if (boards[i].an) n++;
      showToast('Đã ẩn ' + (boards[bid].so !== null ? 'tấm ' + boards[bid].so : boards[bid].ten) + ' (đang ẩn ' + n + ' tấm)', 'info');
      return;
    }
    if (tool === 'nhom') { chonNhom(bid); return; }
    chonTam(bid, {});
  }

  // ====== THẺ THÔNG TIN ======
  function oThongTin(nhan, giaTri, full, mau) {
    return '<div class="info-item' + (full ? ' full' : '') + '"><div class="info-label">' + nhan + '</div>' +
      '<div class="info-val">' + (mau ? '<span class="mat-dot" style="background:' + mau + '"></span>' : '') + giaTri + '</div></div>';
  }
  function showCard(board, warn) {
    if (!board) { infoCard.classList.remove('show'); return; }
    var co = board.so !== null && board.so !== undefined;
    $('cardSo').textContent = co ? String(board.so) : 'Không số';
    $('cardSo').className = 'so-badge' + (co ? '' : ' nho');
    $('cardTen').textContent = board.ten;
    $('cardSub').textContent = co ? ('Mã tem: ' + board.so + '.' + board.ten) : 'Tấm chưa có số tem (board-index)';
    $('cardWarn').textContent = warn || '';
    $('cardWarn').classList.toggle('show', !!warn);
    var kt = board.kt;
    var html = oThongTin('Kích thước (Dài × Rộng × Dày)', fmt(kt[0]) + ' × ' + fmt(kt[1]) + ' × ' + fmt(kt[2]) + ' mm', true);
    html += oThongTin('Vật liệu', escapeHtml(board.vl), false, 'rgb(' + board.mau.join(',') + ')');
    html += oThongTin('Cục tủ', escapeHtml(board.cuc), false);
    if (board.player.length) html += oThongTin('Gia công', escapeHtml(board.player.join(', ')), true);
    $('cardGrid').innerHTML = html;
    infoCard.classList.add('show');
  }
  function showCardNhom(ten, bids) {
    var mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (var i = 0; i < bids.length; i++) {
      var b = boards[bids[i]];
      for (var a = 0; a < 3; a++) { mn[a] = Math.min(mn[a], b.bmn[a]); mx[a] = Math.max(mx[a], b.bmx[a]); }
    }
    $('cardSo').textContent = 'Nhóm';
    $('cardSo').className = 'so-badge nhom';
    $('cardTen').textContent = ten;
    $('cardSub').textContent = bids.length + ' tấm';
    $('cardWarn').classList.remove('show');
    $('cardGrid').innerHTML = oThongTin('Khung bao (Ngang X × Ngang Y × Cao Z)',
      fmt(mx[0] - mn[0]) + ' × ' + fmt(mx[1] - mn[1]) + ' × ' + fmt(mx[2] - mn[2]) + ' mm', true);
    infoCard.classList.add('show');
    return [mn, mx];
  }
  $('btnCloseCard').addEventListener('click', function () { datChon([]); showCard(null); });

  function chonTam(bid, opt) {

  function chonNhom(bid) {
    if (bid < 0) { datChon([]); showCard(null); return; }
    var ci = boards[bid].cucIndex, list = [];
    for (var i = 0; i < boards.length; i++) if (boards[i].cucIndex === ci && boards[i].hien) list.push(i);

  // ====== CHỌN NHÓM: theo cục tủ, tiền tố, hậu tố (phòng) ======
  function moChonNhom() {
    moSheet('Chọn nhóm');

      var m = {}, ds = [];
      for (var i = 0; i < boards.length; i++) {
        var v = key === 'cuc' ? boards[i].cuc : boards[i][key];
        if (!v) continue;
        if (!m[v]) { m[v] = []; ds.push(v); }
        m[v].push(i);
      }
      ds.sort(function (a, b) { return a.localeCompare(b, 'vi', { numeric: true }); });

    var nhom = { cuc: gom('cuc'), tien: gom('tien'), hau: gom('hau') };

    [['cuc', 'Cục tủ'], ['tien', 'Tiền tố'], ['hau', 'Hậu tố (phòng)']].forEach(function (sec) {
      var g = nhom[sec[0]];

      html += '<div class="sec-title">' + sec[1] + '</div><div class="chips">';

        html += '<button type="button" class="chip chon" data-k="' + sec[0] + '" data-v="' + escapeHtml(v) + '">' +

      });

        }

  // ====== TÌM THEO SỐ / TEM ======
  function parseQrQuery(raw) {
    var s = String(raw || '').trim();
    if (!s) return null;
    var m = s.match(/^(\d+)(?:\s*\.\s*([\s\S]*))?$/);
    if (m) return { so: parseInt(m[1], 10), tenTem: (m[2] || '').trim() };
    return { so: null, text: s };
  }
  var lastSo = null, lastIdx = 0;
  function timTam(rawQuery) {
    var q = parseQrQuery(rawQuery);
    if (!q) { showToast('Hãy nhập số tấm cần tìm', 'info'); return; }
    if (tool === 'do' || tool === 'an') datTool('chon');
    if (q.so !== null) {
      var ms = [], i;
      for (i = 0; i < boards.length; i++) if (boards[i].so === q.so) ms.push(boards[i]);
      if (!ms.length) { showToast('Không có tấm số ' + q.so + ' trong file này', 'error'); return; }
      var chosen = ms[0];
      if (ms.length > 1) {
        var exact = null;
        if (q.tenTem) for (i = 0; i < ms.length; i++) if (normalizeText(ms[i].ten) === normalizeText(q.tenTem)) { exact = ms[i]; break; }
        if (exact) chosen = exact;
        else { lastIdx = (lastSo === q.so) ? (lastIdx + 1) % ms.length : 0; chosen = ms[lastIdx]; }
      }
      lastSo = q.so;
      var warn = '';
      if (q.tenTem && normalizeText(q.tenTem) !== normalizeText(chosen.ten)) {
        warn = 'Tên trên tem khác tên trong file (Tem: "' + q.tenTem + '")';
        showToast('Tên trên tem khác tên trong file', 'warn');
      } else if (ms.length > 1) {
        showToast('Có ' + ms.length + ' tấm số ' + q.so + ' (bấm Tìm lại để chuyển)', 'info');
      }
      chonTam(chosen.bid, { focus: true, warn: warn });
      searchInput.blur();
      return;
    }
    var kw = normalizeText(q.text);
    for (var j = 0; j < boards.length; j++) {
      if (normalizeText(boards[j].ten).indexOf(kw) !== -1) { chonTam(j, { focus: true }); searchInput.blur(); return; }
    }
    showToast('Không tìm thấy tấm khớp "' + q.text + '"', 'error');
  }
  searchInput.addEventListener('input', function () { btnClear.classList.toggle('show', searchInput.value.length > 0); });
  searchInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); timTam(searchInput.value); } });
  btnClear.addEventListener('click', function () { searchInput.value = ''; btnClear.classList.remove('show'); searchInput.focus(); });
  $('btnSearch').addEventListener('click', function () { timTam(searchInput.value); });

  // ====== QUÉT TEM ======
  //  1) Mở camera ngay trong trang và quét liên tục.
  //  2) Không mở được thì cho nút "Chụp ảnh tem": dùng app Camera của máy, đọc mã trong ảnh.
  var qrStream = null, qrTimer = null;
  var qrPhoto = $('qrPhoto');
  var QR_IPHONE_MSG = 'Máy này không đọc được mã QR trong file. Hãy mở Camera của máy, quét tem, bấm giữ dòng chữ hiện ra để sao chép rồi dán vào ô tìm.';
  function coBarcodeDetector() { return ('BarcodeDetector' in window) && typeof window.createImageBitmap === 'function'; }
  function stopQrScanner() {
    if (qrTimer) { clearTimeout(qrTimer); qrTimer = null; }
    if (qrStream) { var tr = qrStream.getTracks(); for (var i = 0; i < tr.length; i++) tr[i].stop(); qrStream = null; }
    qrVideo.srcObject = null;
    qrModal.classList.remove('show');
  }
  function daDocDuocMa(val) {
    val = String(val).trim();
    if (navigator.vibrate) navigator.vibrate(60);
    searchInput.value = val;
    btnClear.classList.add('show');
    timTam(val);
  }
  function chupAnhTem() {
    stopQrScanner();
    alertModal.classList.remove('show');
    qrPhoto.value = '';
    qrPhoto.click();
  }
  function openQrScanner() {
    if (!coBarcodeDetector()) { showAlert('Quét tem', QR_IPHONE_MSG); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { chupAnhTem(); return; }
    var detector;
    try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { chupAnhTem(); return; }
    // Hiện khung camera ngay để biết đã bấm; quá 10 giây camera chưa lên thì chuyển sang chụp ảnh
    $('qrTrangThai').textContent = 'Đang mở camera… (máy hỏi quyền thì bấm Cho phép)';
    qrModal.classList.add('show');
    var xong = false;
    var henGio = setTimeout(function () {
      if (xong) return;
      xong = true;
      stopQrScanner();
      showAlert('Camera chưa mở được', 'Chờ quá lâu mà camera chưa lên.\n\nBấm "Chụp ảnh tem" để chụp bằng camera của máy, file sẽ tự đọc mã.', true);
    }, 10000);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
      .then(function (stream) {
        if (xong) { var t0 = stream.getTracks(); for (var q = 0; q < t0.length; q++) t0[q].stop(); return; }
        xong = true; clearTimeout(henGio);
        $('qrTrangThai').textContent = 'Đưa mã QR trên tem vào khung cam';
        qrStream = stream;
        qrVideo.srcObject = stream;
        qrModal.classList.add('show');
        var pl = qrVideo.play();
        if (pl && pl.catch) pl.catch(function () {});
        var loop = function () {
          if (!qrStream) return;
          if (qrVideo.readyState >= 2) {
            detector.detect(qrVideo).then(function (codes) {
              if (!qrStream) return;
              if (codes && codes.length && codes[0].rawValue) { stopQrScanner(); daDocDuocMa(codes[0].rawValue); return; }
              qrTimer = setTimeout(loop, 180);
            }).catch(function () { if (qrStream) qrTimer = setTimeout(loop, 260); });
          } else {
            qrTimer = setTimeout(loop, 180);
          }
        };
        qrTimer = setTimeout(loop, 250);
      })
      .catch(function (err) {
        if (xong) return;
        xong = true; clearTimeout(henGio);
        stopQrScanner();
        var ten = err && err.name ? err.name : String(err);
        var lyDo = (ten === 'NotAllowedError' || ten === 'SecurityError') ? 'Camera bị chặn với file này.'
          : (ten === 'NotReadableError' ? 'Camera đang bị app khác dùng.' : 'Không mở được camera.');
        showAlert('Không mở được camera', lyDo + ' (mã lỗi: ' + ten + ')\n\nBấm "Chụp ảnh tem" để chụp bằng camera của máy, file sẽ tự đọc mã.', true);
      });
  }
  function docQrTuAnh(file) {
    var detector;
    try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { showAlert('Quét tem', QR_IPHONE_MSG); return; }
    showToast('Đang đọc mã trên tem...', 'info');
    window.createImageBitmap(file).then(function (bmp) {
      return detector.detect(bmp).then(function (codes) {
        if (codes && codes.length) return codes;
        var tl = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
        if (tl >= 1) return codes;
        var cv = document.createElement('canvas');
        cv.width = Math.round(bmp.width * tl); cv.height = Math.round(bmp.height * tl);
        cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        return detector.detect(cv);
      });
    }).then(function (codes) {
      if (!codes || !codes.length || !codes[0].rawValue) {
        showToast('Không đọc được mã QR. Chụp gần hơn, rõ nét, đủ sáng rồi thử lại.', 'error', 4000);
        return;
      }
      daDocDuocMa(codes[0].rawValue);
    }).catch(function (err) {
      showAlert('Không đọc được ảnh', 'Lỗi: ' + (err && err.message ? err.message : err) + '\n\n' + QR_IPHONE_MSG);
    });
  }
  qrPhoto.addEventListener('change', function () { if (qrPhoto.files && qrPhoto.files[0]) docQrTuAnh(qrPhoto.files[0]); });
  $('btnScan').addEventListener('click', openQrScanner);

  // ====== ĐIỀU KHIỂN CẢM ỨNG & CHUỘT ======
  function tocDoXoay() { return 0.0075 * (caiDat.xoay || 5) / 5; }
  function panCamera(dx, dy) {
    var s = cam.dist * 0.0014;
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var rx = -sy, ry = cy, ux = -sp * cy, uy = -sp * sy, uz = cp;
    cam.tx += (-rx * dx + ux * dy) * s;
    cam.ty += (-ry * dx + uy * dy) * s;
    cam.tz += (uz * dy) * s;
  }
  function clampZoom(d) { return Math.max(80, Math.min(modelRadius * 12, d)); }

  function setupControls() {
    var btn = -1, downX = 0, downY = 0, lastX = 0, lastY = 0, moved = false;
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    canvas.addEventListener('mousedown', function (e) {
      camAnim = null; btn = e.button; downX = lastX = e.clientX; downY = lastY = e.clientY; moved = false;
    });
    window.addEventListener('mousemove', function (e) {
      if (btn === -1) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 5) moved = true;
      if (btn === 0 && !e.shiftKey) {
        cam.yaw -= dx * tocDoXoay();
        cam.pitch = Math.max(-1.48, Math.min(1.48, cam.pitch + dy * tocDoXoay()));
      } else {
        panCamera(dx, dy);
      }
      requestRender();
    });
    window.addEventListener('mouseup', function (e) {
      if (btn === 0 && !moved) xuLyCham(e.clientX, e.clientY);
      btn = -1;
    });
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault(); camAnim = null;
      cam.dist = clampZoom(cam.dist * (e.deltaY > 0 ? 1.12 : 0.89));
      requestRender();
    }, { passive: false });

    var mode = 'none', sx = 0, sy = 0, st = 0, lx = 0, ly = 0, tMoved = false, pd = 0, pmx = 0, pmy = 0;
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault(); camAnim = null;
      if (e.touches.length === 1) {
        var t = e.touches[0];
        mode = 'orbit'; sx = lx = t.clientX; sy = ly = t.clientY; st = performance.now(); tMoved = false;
      } else if (e.touches.length >= 2) {
        var a = e.touches[0], b = e.touches[1];
        mode = 'pinch'; tMoved = true;
        pd = Math.sqrt(Math.pow(b.clientX - a.clientX, 2) + Math.pow(b.clientY - a.clientY, 2)) || 1;
        pmx = (a.clientX + b.clientX) / 2; pmy = (a.clientY + b.clientY) / 2;
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (e.touches.length === 1 && mode === 'orbit') {
        var t = e.touches[0];
        var dx = t.clientX - lx, dy = t.clientY - ly;
        lx = t.clientX; ly = t.clientY;
        if (Math.abs(t.clientX - sx) + Math.abs(t.clientY - sy) > 10) tMoved = true;
        cam.yaw -= dx * tocDoXoay();
        cam.pitch = Math.max(-1.48, Math.min(1.48, cam.pitch + dy * tocDoXoay()));
        requestRender();
      } else if (e.touches.length >= 2) {
        var a = e.touches[0], b = e.touches[1];
        var d = Math.sqrt(Math.pow(b.clientX - a.clientX, 2) + Math.pow(b.clientY - a.clientY, 2)) || 1;
        var mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
        if (mode !== 'pinch') { mode = 'pinch'; tMoved = true; pd = d; pmx = mx; pmy = my; return; }
        cam.dist = clampZoom(cam.dist * pd / d);
        panCamera(mx - pmx, my - pmy);
        pd = d; pmx = mx; pmy = my;
        requestRender();
      }
    }, { passive: false });
    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      if (e.touches.length === 0) {
        if (mode === 'orbit' && !tMoved && performance.now() - st < 400) xuLyCham(sx, sy);
        mode = 'none';
      } else if (e.touches.length === 1) {
        mode = 'orbit'; lx = e.touches[0].clientX; ly = e.touches[0].clientY; tMoved = true;
      }
    }, { passive: false });
    canvas.addEventListener('touchcancel', function () { mode = 'none'; });
  }

  // ====== KHỞI CHẠY ======
  function resizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(window.innerWidth * dpr)), h = Math.max(1, Math.round(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      ovCanvas.width = w; ovCanvas.height = h;
      requestRender();
    }
  }
  function tick(now) {
    if (camAnim) {
      var t = Math.min(1, (now - camAnim.start) / camAnim.duration), e = 1 - Math.pow(1 - t, 3);
      for (var k in camAnim.to) cam[k] = camAnim.from[k] + (camAnim.to[k] - camAnim.from[k]) * e;
      needsRender = true;
      if (t >= 1) camAnim = null;
    }
    if (needsRender) { needsRender = false; render(); }
    requestAnimationFrame(tick);
  }
  function startApp() {
    if (DU_LIEU) {
      document.title = (DU_LIEU.ten_file || 'Xem 3D') + ' - TOAN Tools';
      $('fileMeta').innerHTML = '<strong>' + escapeHtml(DU_LIEU.ten_file || 'Model 3D') + '</strong><br>' +
        escapeHtml(DU_LIEU.ngay_xuat || '') + ' • ' + (DU_LIEU.tam ? DU_LIEU.tam.length : 0) + ' tấm';
    }
    if (!initWebGL()) return;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); }, false);
    canvas.addEventListener('webglcontextrestored', function () {
      try {
        initWebGL();
        pickFbo = null; pickW = 0; pickH = 0;
        napBufferGPU();
        requestRender();
      } catch (err) {
        showAlert('Lỗi hiển thị', 'Không vẽ lại được 3D, hãy tải lại trang.\n' + (err && err.message ? err.message : err));
      }
    }, false);
    buildScene(DU_LIEU || { luoi: [], tam: [] });
    capNhatHien();
    initCam = { tx: modelCenter[0], ty: modelCenter[1], tz: modelCenter[2], yaw: -Math.PI * 0.36, pitch: 0.32, dist: fitDist(modelRadius) };
    for (var k in initCam) cam[k] = initCam[k];
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    setupControls();
    datTool('chon');
    requestAnimationFrame(tick);
  }

  try {
    startApp();
    $('canhBaoJs').style.display = 'none';
  } catch (err) {
    $('canhBaoLoi').textContent = 'Lỗi: ' + (err && err.message ? err.message : err);
  }
})();
</script>
